# AI Bat Phone — provider registry.
#
# adapter = "statuspage"  -> {base}/api/v2/incidents.json  (+ scheduled-maintenances.json if it exists)
#                            Covers Atlassian Statuspage, Instatus and incident.io, which all
#                            expose the same v2 JSON shape.
# adapter = "rss"         -> {base}/history.rss  (for pages that block JSON but serve a feed)
# adapter = "gcp"         -> status.cloud.google.com/incidents.json, filtered by `match`
#
# `enabled = false` keeps a provider documented but unpolled.

[[provider]]
key = "anthropic"
name = "Claude"
adapter = "statuspage"
base = "https://status.claude.com"

[[provider]]
key = "openai"
name = "OpenAI"
adapter = "statuspage"
base = "https://status.openai.com"

[[provider]]
key = "cursor"
name = "Cursor"
adapter = "statuspage"
base = "https://status.cursor.com"

[[provider]]
key = "github"
name = "GitHub"
adapter = "statuspage"
base = "https://www.githubstatus.com"

[[provider]]
key = "windsurf"
name = "Windsurf"
adapter = "statuspage"
base = "https://status.windsurf.com"

[[provider]]
key = "vercel"
name = "Vercel"
adapter = "statuspage"
base = "https://www.vercel-status.com"

[[provider]]
key = "groq"
name = "Groq"
adapter = "statuspage"
base = "https://groqstatus.com"

[[provider]]
key = "cohere"
name = "Cohere"
adapter = "statuspage"
base = "https://status.cohere.com"

[[provider]]
key = "fireworks"
name = "Fireworks AI"
adapter = "statuspage"
base = "https://status.fireworks.ai"

[[provider]]
key = "elevenlabs"
name = "ElevenLabs"
adapter = "statuspage"
base = "https://status.elevenlabs.io"

[[provider]]
key = "lovable"
name = "Lovable"
adapter = "statuspage"
base = "https://status.lovable.dev"

[[provider]]
key = "deepseek"
name = "DeepSeek"
adapter = "rss"
base = "https://status.deepseek.com"

[[provider]]
key = "replit"
name = "Replit"
adapter = "rss"
base = "https://status.replit.com"

[[provider]]
key = "perplexity"
name = "Perplexity"
adapter = "rss"
base = "https://status.perplexity.com"

[[provider]]
key = "google"
name = "Google Vertex AI / Gemini"
adapter = "gcp"
base = "https://status.cloud.google.com"
match = ["Vertex AI", "Gemini", "Generative Language"]

[[provider]]
key = "cerebras"
name = "Cerebras Inference"
adapter = "statuspage"
base = "https://status.cerebras.ai"

[[provider]]
key = "sambanova"
name = "SambaNova"
adapter = "statuspage"
base = "https://status.sambanova.ai"

[[provider]]
key = "baseten"
name = "Baseten"
adapter = "statuspage"
base = "https://status.baseten.co"

[[provider]]
key = "ai21"
name = "AI21"
adapter = "statuspage"
base = "https://status.ai21.com"

[[provider]]
key = "moonshot"
name = "Moonshot AI (Kimi)"
adapter = "statuspage"
base = "https://status.moonshot.cn"

# --- Known gaps -------------------------------------------------------------
# Everything below is deliberately not polled, each with the reason. These are
# published on the index page too: a reader seeing no Mistral outages should
# know Mistral is not watched, rather than concluding Mistral had a good month.
#
# `blocked = true` means the endpoint cannot be read, so the `adapter` and
# `base` here are guesses, not verified config — flipping `enabled` on one of
# those gives you a broken provider, not a working one. Blocks without it are
# reachable and simply out of scope; those you can turn on as they stand.

[[provider]]
key = "xai"
blocked = true
name = "xAI"
adapter = "statuspage"
base = "https://status.x.ai"
enabled = false
note = "Cloudflare bot challenge on every path, including history.rss."

[[provider]]
key = "mistral"
blocked = true
name = "Mistral"
adapter = "statuspage"
base = "https://status.mistral.ai"
enabled = false
note = "JS-only status page; no JSON or RSS endpoint on the custom domain."

[[provider]]
key = "huggingface"
blocked = true
name = "Hugging Face"
adapter = "statuspage"
base = "https://status.huggingface.co"
enabled = false
note = "JS-only status page; no JSON or RSS endpoint on the custom domain."

[[provider]]
key = "together"
blocked = true
name = "Together AI"
adapter = "statuspage"
base = "https://status.together.ai"
enabled = false
note = "JS-only status page; no JSON or RSS endpoint on the custom domain."

[[provider]]
key = "aws"
blocked = true
name = "AWS (Bedrock)"
adapter = "rss"
base = "https://status.aws.amazon.com"
path = "/rss/all.rss"
enabled = false
note = "Feed is one item per update rather than per incident, and covers all of AWS; needs its own adapter."

[[provider]]
key = "azure"
blocked = true
name = "Azure OpenAI"
adapter = "rss"
base = "https://azure.status.microsoft"
path = "/en-us/status/feed/"
enabled = false
note = "Feed returns zero items; Microsoft publishes status through a different mechanism."

[[provider]]
key = "stability"
name = "Stability AI"
adapter = "statuspage"
base = "https://status.stability.ai"
enabled = false
note = "Reachable, but images rather than language models."

[[provider]]
key = "deepgram"
name = "Deepgram"
adapter = "statuspage"
base = "https://status.deepgram.com"
enabled = false
note = "Reachable, but speech rather than language models."

[[provider]]
key = "assemblyai"
name = "AssemblyAI"
adapter = "statuspage"
base = "https://status.assemblyai.com"
enabled = false
note = "Reachable, but speech rather than language models."

[[provider]]
key = "openrouter"
name = "OpenRouter"
adapter = "statuspage"
base = "https://status.openrouter.ai"
enabled = false
blocked = true
note = "Status host exists but 404s on every JSON and feed path tried."
