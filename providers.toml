# AI Bat Phone — provider registry.
#
# adapter = "statuspage"  -> {base}/api/v2/incidents.json  (+ scheduled-maintenances.json if it exists)
#                            Covers Atlassian Statuspage, Instatus and incident.io, which all
#                            expose the same v2 JSON shape.
# adapter = "rss"         -> {base}/history.rss  (for pages that block JSON but serve a feed)
# adapter = "gcp"         -> status.cloud.google.com/incidents.json, filtered by `match`
#
# `enabled = false` keeps a provider documented but unpolled.

[[provider]]
key = "anthropic"
name = "Claude"
adapter = "statuspage"
base = "https://status.claude.com"

[[provider]]
key = "openai"
name = "OpenAI"
adapter = "statuspage"
base = "https://status.openai.com"

