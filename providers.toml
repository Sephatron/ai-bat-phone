# --- Known gaps -------------------------------------------------------------
# Everything below is deliberately not polled, each with the reason. These are
# published on the index page too: a reader seeing no Mistral outages should
# know Mistral is not watched, rather than concluding Mistral had a good month.
#
# `blocked = true` means the endpoint cannot be read, so the `adapter` and
# `base` here are guesses, not verified config — flipping `enabled` on one of
# those gives you a broken provider, not a working one. Blocks without it are
# reachable and simply out of scope; those you can turn on as they stand.

[[provider]]
key = "xai"
blocked = true
name = "xAI"
adapter = "statuspage"
base = "https://status.x.ai"
enabled = false
note = "Cloudflare bot challenge on every path, including history.rss."

[[provider]]
key = "mistral"
blocked = true
name = "Mistral"
adapter = "statuspage"
base = "https://status.mistral.ai"
enabled = false
note = "JS-only status page; no JSON or RSS endpoint on the custom domain."

[[provider]]
key = "huggingface"
blocked = true
name = "Hugging Face"
adapter = "statuspage"
base = "https://status.huggingface.co"
enabled = false
note = "JS-only status page; no JSON or RSS endpoint on the custom domain."

[[provider]]
key = "together"
blocked = true
name = "Together AI"
adapter = "statuspage"
base = "https://status.together.ai"
enabled = false
note = "JS-only status page; no JSON or RSS endpoint on the custom domain."

[[provider]]
key = "aws"
blocked = true
name = "AWS (Bedrock)"
adapter = "rss"
base = "https://health.aws.amazon.com"
path = "/public/events"
enabled = false
note = "Deferred 2026-09-07, not blocked: nobody confirmed AWS models are in use. Needs an aws adapter, not rss."
# The RSS feeds under status.aws.amazon.com are the wrong source: one item per
# update rather than per incident (23 items for a single ongoing disruption),
# with no status marker in any description. Per-service feeds do exist
# (rss/bedrock-eu-west-2.rss and similar) but share that shape.
#
# The right source is health.aws.amazon.com/public/events: one entry per
# incident, with service, region, startTime and endTime, so resolution comes
# from endTime rather than from inference. There is a real BEDROCK event in it.
# Quirks to expect: the JSON is UTF-16 encoded, timestamps are epoch millis as
# strings, and metadata is a Python dict repr inside a string — parse the
# summary out with a bounded regex rather than literal_eval. It is an
# undocumented endpoint, so it can change without notice.

[[provider]]
key = "azure"
blocked = true
name = "Azure OpenAI"
adapter = "rss"
base = "https://azure.status.microsoft"
path = "/en-us/status/feed/"
enabled = false
note = "Feed returns zero items; Microsoft publishes status through a different mechanism."

[[provider]]
key = "stability"
name = "Stability AI"
adapter = "statuspage"
base = "https://status.stability.ai"
enabled = false
note = "Reachable, but images rather than language models."

[[provider]]
key = "deepgram"
name = "Deepgram"
adapter = "statuspage"
base = "https://status.deepgram.com"
enabled = false
note = "Reachable, but speech rather than language models."

[[provider]]
key = "assemblyai"
name = "AssemblyAI"
adapter = "statuspage"
base = "https://status.assemblyai.com"
enabled = false
note = "Reachable, but speech rather than language models."
