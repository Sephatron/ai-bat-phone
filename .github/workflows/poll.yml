name: poll

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort and drifts under load,
    # so treat this as "within about 15 minutes", not a guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll status pages
        run: python collect.py

      - name: Publish if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Quiet run — nothing to publish."
            exit 0
          fi
          git config user.name "ai-bat-phone"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feed: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # A manual dispatch can land between our checkout and our push.
          git push || (git pull --rebase && git push)
