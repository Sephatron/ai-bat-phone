name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately no live poll here. Running collect.py against fifteen third
      # parties made every push depend on them: a runner network blip turned CI
      # red on a docstring change, while a single provider changing shape — the
      # thing worth catching — passed green. The poll job reports that instead.
      - name: Unit tests
        run: python -m unittest -v
